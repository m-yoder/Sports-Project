<!DOCTYPE html>
<html>
    <head>
         <title>A Simple Scene</title> 
         <script src= "https://aframe.io/releases/1.7.0/aframe.min.js"> 
         </script>
    </head>
    <body> 
        <a-scene> 

            <a-assets>
                <img id="grass-base" src="assets\Grass_001_COLOR.jpg">
                <img id="grass-ambient-occlusion" src="assets\_Grass_001_OCC.jpg">
                <img id="grass-normal" src="assets\Grass_001_NORM.jpg">

                <canvas id="pitch-lines" width="1000" height="600"></canvas>
                <script>
                    (function () {
                        var canvas = document.getElementById('pitch-lines');
                        var ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, 1000, 600);
                        ctx.strokeStyle = '#ffffff';
                        ctx.fillStyle = '#ffffff';
                        ctx.lineWidth = 4;

                        // Outer boundary
                        ctx.strokeRect(2, 2, 996, 596);

                        // Halfway line
                        ctx.beginPath();
                        ctx.moveTo(500, 0);
                        ctx.lineTo(500, 600);
                        ctx.stroke();

                        // Center circle + spot
                        ctx.beginPath();
                        ctx.arc(500, 300, 90, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(500, 300, 4, 0, Math.PI * 2);
                        ctx.fill();

                        // Penalty areas (16m deep x 40m wide)
                        ctx.strokeRect(2, 100, 160, 400);          // left
                        ctx.strokeRect(838, 100, 160, 400);        // right

                        // Goal areas (5.5m deep x 18.32m wide)
                        ctx.strokeRect(2, 208, 55, 184);           // left
                        ctx.strokeRect(943, 208, 55, 184);         // right

                        // Penalty spots
                        ctx.beginPath();
                        ctx.arc(110, 300, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(890, 300, 4, 0, Math.PI * 2);
                        ctx.fill();

                        // Penalty arcs (the "D")
                        ctx.beginPath();
                        ctx.arc(110, 300, 91.5, -0.9, 0.9);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(890, 300, 91.5, Math.PI - 0.9, Math.PI + 0.9);
                        ctx.stroke();

                        // Corner arcs
                        ctx.beginPath(); ctx.arc(2, 2, 15, 0, Math.PI / 2); ctx.stroke();
                        ctx.beginPath(); ctx.arc(998, 2, 15, Math.PI / 2, Math.PI); ctx.stroke();
                        ctx.beginPath(); ctx.arc(2, 598, 15, -Math.PI / 2, 0); ctx.stroke();
                        ctx.beginPath(); ctx.arc(998, 598, 15, Math.PI, Math.PI * 1.5); ctx.stroke();
                    })();
                </script>

                <canvas id="sign-texture" width="1024" height="256"></canvas>
                <script>
                    (function () {
                        var canvas = document.getElementById('sign-texture');
                        var ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#0a2a4d';
                        ctx.fillRect(0, 0, 1024, 256);
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 8;
                        ctx.strokeRect(8, 8, 1008, 240);
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 100px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('Soccer VR Training', 512, 128);
                    })();
                </script>
            </a-assets>

            </a-assets>

            <a-plane
                material= "src: #grass-base; 
                    repeat: 500 500; 
                    ambientOcclusionMap: #grass-ambient-occlusion; 
                    ambientOcclusionTextureRepeat: 500 500; 
                    normalMap: #grass-normal; 
                    normalTextureRepeat: 500 500"
                position="0 0 0"
                rotation="-90 0 0"
                width="500"
                height="500"
            > 
            </a-plane> 

            <a-plane
                material="src: #pitch-lines; transparent: true; alphaTest: 0.1; shader: flat"
                position="0 0.02 0"
                rotation="-90 0 0"
                width="100"
                height="60"
            >
            </a-plane>

            <a-sky 
                color="lightskyblue" 
            > 
            </a-sky> 

            <a-entity position="-48 0 0">
                <a-box position="0 1.22 -3.66" width="0.12" height="2.44" depth="0.12" color="#ffffff"></a-box>
                <a-box position="0 1.22 3.66" width="0.12" height="2.44" depth="0.12" color="#ffffff"></a-box>
                <a-box position="0 2.44 0" width="0.12" height="0.12" depth="7.44" color="#ffffff"></a-box>
            </a-entity>

            <!-- Goal, right end (x = 50) -->
            <a-entity position="48 0 0">
                <a-box position="0 1.22 -3.66" width="0.12" height="2.44" depth="0.12" color="#ffffff"></a-box>
                <a-box position="0 1.22 3.66" width="0.12" height="2.44" depth="0.12" color="#ffffff"></a-box>
                <a-box position="0 2.44 0" width="0.12" height="0.12" depth="7.44" color="#ffffff"></a-box>
            </a-entity>

             <a-entity position="0 0 -34">
                <a-box position="-9 5 0" width="0.4" height="10" depth="0.4" color="#333333"></a-box>
                <a-box position="9 5 0" width="0.4" height="10" depth="0.4" color="#333333"></a-box>
                <a-plane
                    position="0 9 0"
                    width="18"
                    height="4.5"
                    material="src: #sign-texture; shader: flat">
                </a-plane>
            </a-entity>

            <!-- ===================== STADIUM ===================== -->

            <!-- Far-side stand (z negative, behind the sign) -->
            <a-entity position="0 0 0">
                <a-box position="0 1 -38" width="90" height="2" depth="4" color="#7d7d7d"></a-box>
                <a-box position="0 2.5 -42" width="90" height="3" depth="4" color="#5f5f5f"></a-box>
                <a-box position="0 4.25 -46" width="90" height="4.5" depth="4" color="#7d7d7d"></a-box>
                <a-box position="0 6.25 -50" width="90" height="5.5" depth="4" color="#5f5f5f"></a-box>
                <!-- roof over top tier -->
                <a-box position="0 9.2 -50" width="92" height="0.3" depth="8" color="#1a1a1a" rotation="-8 0 0"></a-box>
            </a-entity>

            <!-- Near-side stand (z positive, opposite the entrance) -->
            <a-entity position="0 0 0">
                <a-box position="0 1 38" width="90" height="2" depth="4" color="#7d7d7d"></a-box>
                <a-box position="0 2.5 42" width="90" height="3" depth="4" color="#5f5f5f"></a-box>
                <a-box position="0 4.25 46" width="90" height="4.5" depth="4" color="#7d7d7d"></a-box>
                <a-box position="0 6.25 50" width="90" height="5.5" depth="4" color="#5f5f5f"></a-box>
                <a-box position="0 9.2 50" width="92" height="0.3" depth="8" color="#1a1a1a" rotation="8 0 0"></a-box>
            </a-entity>

            <!-- Corner floodlight poles: cylinder pole + sphere light fixture + cone spire -->
            <a-entity position="-55 0 -35">
                <a-cylinder position="0 8 0" radius="0.3" height="16" color="#444444"></a-cylinder>
                <a-sphere position="0 16.3 0" radius="1" color="#fff8dc"></a-sphere>
                <a-cone position="0 17.3 0" radius-bottom="0.4" radius-top="0" height="1" color="#444444"></a-cone>
            </a-entity>
            <a-entity position="55 0 -35">
                <a-cylinder position="0 8 0" radius="0.3" height="16" color="#444444"></a-cylinder>
                <a-sphere position="0 16.3 0" radius="1" color="#fff8dc"></a-sphere>
                <a-cone position="0 17.3 0" radius-bottom="0.4" radius-top="0" height="1" color="#444444"></a-cone>
            </a-entity>
            <a-entity position="-55 0 35">
                <a-cylinder position="0 8 0" radius="0.3" height="16" color="#444444"></a-cylinder>
                <a-sphere position="0 16.3 0" radius="1" color="#fff8dc"></a-sphere>
                <a-cone position="0 17.3 0" radius-bottom="0.4" radius-top="0" height="1" color="#444444"></a-cone>
            </a-entity>
            <a-entity position="55 0 35">
                <a-cylinder position="0 8 0" radius="0.3" height="16" color="#444444"></a-cylinder>
                <a-sphere position="0 16.3 0" radius="1" color="#fff8dc"></a-sphere>
                <a-cone position="0 17.3 0" radius-bottom="0.4" radius-top="0" height="1" color="#444444"></a-cone>
            </a-entity>

        </a-scene>
    </body>
</html>
