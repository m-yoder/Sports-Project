<!DOCTYPE html>
<html>
    <head>
         <title>A Simple Scene</title> 
         <script src= "https://aframe.io/releases/1.7.0/aframe.min.js"> 
         </script>
    </head>
    <body> 
        <a-scene> 

            <a-assets>
                <img id="grass-base" src="assets\Grass_001_COLOR.jpg">
                <img id="grass-ambient-occlusion" src="assets\_Grass_001_OCC.jpg">
                <img id="grass-normal" src="assets\Grass_001_NORM.jpg">
            </a-assets>

            <a-plane
                material= "src: #grass-base; 
                    repeat: 500 500; 
                    ambientOcclusionMap: #grass-ambient-occlusion; 
                    ambientOcclusionTextureRepeat: 500 500; 
                    normalMap: #grass-normal; 
                    normalTextureRepeat: 500 500"
                position="0 0 0"
                rotation="-90 0 0"
                width="500"
                height="500"
            > 
            </a-plane> 

            <a-sky 
                color="lightskyblue" 
            > 
            </a-sky> 

            <a-box color="white" position="-0 0 -35" roatation="0 0 0" width="100" height=".1" depth=".2"></a-box>
            <a-box color="white" position="0 0 35" rotation="0 0 0" width="100" height=".1" depth=".2"></a-box>
            <a-box color="white" position="50 0 0" rotation="0 90 0" width="70" height=".1" depth=".2"></a-box>
